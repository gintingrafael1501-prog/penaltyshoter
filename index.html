<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Shotter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Layar 1: Menu Utama -->
    <div id="screen-menu" class="screen active">
      <h1 class="logo">PENALTY <span>SHOTTER</span></h1>
      <p class="subtitle">Pilih Peranmu di Lapangan</p>
      <div class="role-cards">
        <button class="role-btn" onclick="selectRole('striker')">
          <span class="icon">⚽</span>
          <strong>STRIKER</strong>
          <small>Cetak gol sebanyak mungkin</small>
        </button>
        <button class="role-btn" onclick="selectRole('keeper')">
          <span class="icon">🧤</span>
          <strong>KIPER</strong>
          <small>Tepis setiap tendangan lawan</small>
        </button>
      </div>
    </div>

    <!-- Layar 2: Pilih / Buat Pemain -->
    <div id="screen-select" class="screen">
      <div class="top-bar">
        <button class="back-btn" onclick="showScreen('screen-menu')">← Kembali</button>
        <h2 id="select-title">Pilih Striker</h2>
      </div>

      <div class="tabs">
        <button id="tab-pro" class="tab active" onclick="switchTab('pro')">5 Pemain Bintang</button>
        <button id="tab-custom" class="tab" onclick="switchTab('custom')">Buat Pemain (15 Poin)</button>
      </div>

      <!-- Tab Pemain Bintang -->
      <div id="panel-pro" class="panel active">
        <div id="player-list" class="player-grid"></div>
      </div>

      <!-- Tab Buat Pemain -->
      <div id="panel-custom" class="panel">
        <div class="custom-box">
          <input type="text" id="custom-name" placeholder="Nama Pemainmu..." maxlength="15" value="Player 1">
          <div class="points-badge">Sisa Poin: <span id="points-left">0</span> / 15</div>
          <div id="stat-sliders"></div>
        </div>
      </div>

      <!-- Pilihan Mode Tendang (Hanya muncul jika Striker) -->
      <div id="mode-selector" class="mode-box">
        <p>Pilih Gaya Tendangan:</p>
        <div class="mode-options">
          <label class="mode-opt">
            <input type="radio" name="kickMode" value="arrow" checked>
            <span>🎯 Panah Geser (Ala Penalty Shooters 2)</span>
          </label>
          <label class="mode-opt">
            <input type="radio" name="kickMode" value="swipe">
            <span>✍️ Tarik Garis & Power</span>
          </label>
        </div>
      </div>

      <button class="start-match-btn" onclick="startMatch()">MULAI PERTANDINGAN</button>
    </div>

    <!-- Layar 3: Arena Pertandingan -->
    <div id="screen-game" class="screen">
      <div class="scoreboard">
        <div class="team">
          <span id="p-name-hud">KAMU</span>
          <div id="p-dots" class="dots"></div>
        </div>
        <div class="score-text"><span id="p-score">0</span> - <span id="cpu-score">0</span></div>
        <div class="team">
          <span id="cpu-name-hud">LAWAN</span>
          <div id="cpu-dots" class="dots"></div>
        </div>
      </div>
      <div id="status-banner" class="banner">Bersiap...</div>
      <canvas id="gameCanvas" width="600" height="450"></canvas>
      <div id="controls-hint" class="hint">Klik / Spasi untuk mengunci arah!</div>
    </div>

    <!-- Layar 4: Game Over / Hasil -->
    <div id="screen-gameover" class="screen">
      <h1 id="result-title">KAMU MENANG!</h1>
      <p id="result-detail">Skor Akhir: 5 - 3</p>
      <div class="end-buttons">
        <button class="start-match-btn" onclick="restartMatch()">Main Lagi (Pemain Sama)</button>
        <button class="secondary-btn" onclick="showScreen('screen-menu')">Ganti Peran / Pemain</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
